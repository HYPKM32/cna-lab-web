# 정적 데모: out/ 정적 파일 + /uploads 는 서버 디스크에서 직접 (PDF 포함)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF 등 전체 업로드 파일 — compose 가 ../uploads 를 마운트
    location /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
