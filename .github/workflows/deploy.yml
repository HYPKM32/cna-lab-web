# GitHub Pages 자동 배포 — gh-pages 브랜치 방식
# main 에 push → 정적 빌드(out/) → gh-pages 브랜치로 push → Pages 가 자동 게시
# (actions/deploy-pages 의 "in progress deployment" 잠금 버그를 피하기 위해
#  브랜치 게시 방식을 사용. Pages 설정: Source = gh-pages 브랜치)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 배포 직렬화: 진행 중 배포를 취소하지 않고 대기
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 커스텀 도메인(cna.hanyang.ac.kr) 루트 서빙 → basePath 없음
      # PDF 원문 호스트(선택): 저장소 Variables 에 PDF_BASE_URL 등록 시 View 버튼 활성화
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_PDF_BASE_URL: ${{ vars.PDF_BASE_URL }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: cna.hanyang.ac.kr
